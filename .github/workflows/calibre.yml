name: 'Calibre'

on:
  workflow_dispatch:
    inputs:
      fileid:
        description: 'File ID'
        type: number
        required: true
      filetype:
        description: 'Filetype'
        type: string
        required: true

jobs:
  calibre:
    runs-on: ubuntu-latest
    steps:
    - name: Install
      if: ${{ inputs.filetype == 'pdf' || inputs.filetype == 'xps' }}
      shell: bash
      run: |
        sudo apt-get update
        if [[ "${{ inputs.filetype }}" == "pdf" ]]; then
          sudo apt-get install -y imagemagick poppler-utils
        elif [[ "${{ inputs.filetype }}" == "xps" ]]; then
          sudo apt-get install -y imagemagick libgxps-utils
        fi
    - name: Download
      shell: bash
      run: |
        libranaut_full_id=$(printf '%07d' '${{ inputs.fileid }}')
        libranaut_dir_id=${libranaut_full_id::-3}
        libranaut_file_id=${libranaut_full_id: -3}
        libranaut_in_file=orig.${{ inputs.filetype }}
        curl -sSo $libranaut_in_file "${{ secrets.WORKFLOW_DOWNLOAD }}$libranaut_dir_id/$libranaut_file_id/$libranaut_in_file"
        echo "libranaut_in_file=$libranaut_in_file" >> $GITHUB_ENV
        echo "libranaut_args=" >> $GITHUB_ENV
    - uses: EIGHTFINITE/ebook-convert-action@main
      if: ${{ inputs.filetype == 'pdf' }}
      with:
        in: ${{ env.libranaut_in_file }}
        out: orig.zip
        args: ${{ env.libranaut_args }}
    - name: Process
      if: ${{ inputs.filetype == 'pdf' || inputs.filetype == 'xps' }}
      shell: bash
      run: |
        if [[ "${{ inputs.filetype }}" == "pdf" ]]; then
          unzip -q orig.zip orig.html
          rm orig.zip
          pdftoppm orig.pdf orig
          for i in *.ppm; do
            convert $i -quiet -quality 90 ${i/.ppm/.webp}
            rm $i
          done
        elif [[ "${{ inputs.filetype }}" == "xps" ]]; then
          xpstopng orig.xps orig
          for i in *.png; do
            convert $i -quiet -quality 90 ${i/.png/.webp}
            rm $i
          done
        fi
        zip -q0 orig.cbz *.webp
        rm *.webp
        echo "libranaut_in_file=orig.cbz" >> $GITHUB_ENV
        echo "libranaut_args=--no-process" >> $GITHUB_ENV
    - uses: EIGHTFINITE/ebook-convert-action@main
      with:
        in: ${{ env.libranaut_in_file }}
        out: orig.zip
        args: ${{ env.libranaut_args }}
    - name: Process
      shell: bash
      run: |
        unzip -q orig.zip -d orig
        rm orig.zip
        if [[ "${{ inputs.filetype }}" == "pdf" ]]; then
          rm orig/orig.html
          mv orig.html orig/orig.html
          perl -pi -e 's/(<a .*?href=")orig_files\/index\.html(".*?>)/\1orig_files\/page_1.xhtml\2/' orig/orig.html
          perl -pi -e 's/(<a .*?href=")orig_files\/index\.html#page_(.*?)(".*?>)/\1orig_files\/page_\2.xhtml\3/g' orig/orig.html
        fi
        perl -0777pi -e 's/\n<div class="calibreMeta">.*?\n<\/div>/\n/s' orig/orig.html
        find orig/orig_files/ -type f \( -name '*.xhtml' -o -name '*.html' \) \
          -exec perl -0777pi -e 's/\n<div class="calibreMeta">.*?\n<\/div>/\n/s' {} \; \
          -exec perl -0777pi -e 's/\n  <div class="calibreToc">.*?\n  <\/div>/\n/s' {} \;
        rm orig/orig_files/calibreHtmlOutBasicCss.css
        cat << 'EOF' > orig/orig_files/calibreHtmlOutBasicCss.css
        html, body {
          margin: 0px;
          padding: 0.25em;
          background-color: #fff;
          font-size: 12px;
          font-family: Arial, Helvetica, sans-serif;
          overflow-x: hidden;
          overflow-y: overlay;
        }
        
        .calibreEbNav, .calibreEbNavTop {
          text-align: center;
        }
        
        .calibreEbNav a, .calibreEbNavTop a {
          display: inline-block;
          padding: 6px 12px;
          font-family: 'Inter', sans-serif;
          font-size: 16px;
          font-weight: 700;
          line-height: 24px;
          color: #5200ff;
          text-align: center;
          text-decoration: none;
          vertical-align: middle;
          cursor: pointer;
          -webkit-user-select: none;
          -moz-user-select: none;
          user-select: none;
          border: 1px solid #5200ff;
          border-radius: 8px;
          background-color: #fff;
          font-optical-sizing: auto;
          text-transform: capitalize;
        }
        
        .calibreEbNav a:hover, .calibreEbNavTop a:hover,
        .calibreEbNav a:active, .calibreEbNavTop a:active {
          color: #fff;
          background-color: #5200ff;
        }
        
        .calibreEbNav a:focus, .calibreEbNavTop a:focus {
          box-shadow: 0 0 0 4px rgba(82, 0, 255, 0.2);
        }
        
        .calibreTocIndex {
          line-height: 18px;
        }
        
        .calibreEbookContent, .calibreEbNav {
          max-width: min(100%, 600px, calc(100vw - 1em));
          margin-inline: auto;
        }
        
        .calibreEbookContent:after {
          display: block;
          clear: both;
          content: "";
        }
        
        .calibreEbookContent > :not(:first-child), .calibreEbookContent > :not(:first-child) * {
          width: auto !important;
          height: auto !important;
          max-width: min(100%, 600px, calc(100vw - 1em)) !important;
          max-height: none !important;
          position: static !important;
          object-fit: scale-down;
        }
        EOF
        (cd orig && zip -rq0 ../orig.zip .)
        cat << 'EOF' > read.php
        <?php
        $chapters = [];
        $currentFile = file_get_contents('orig/orig.html');
        if($currentFile !== false) {
          $currentMatches = [];
          $currentMatchesCount = preg_match_all('/<a .*href="(.*)".*>(.*)<\/a>/U', $currentFile, $currentMatches);
          if($currentMatchesCount === false) {
            $currentMatchesCount = 0;
          }
          for($i = 0; ($i+1) < $currentMatchesCount; $i++) {
            if(!isset($currentMatches[2][$i]) || !is_string($currentMatches[2][$i])) {
              $currentMatchTitle = '';
            }
            else {
              $currentMatchTitle = $currentMatches[2][$i];
            }
            if(!isset($currentMatches[1][$i]) || !is_string($currentMatches[1][$i])) {
              $currentMatchPage = '';
            }
            else {
              $currentMatchPage = explode('#', $currentMatches[1][$i], 2)[0];
            }
            $chapters[] = [$currentMatchTitle, $currentMatchPage];
          }
        }
        file_put_contents('chapters.json', json_encode($chapters));
        $pages = [];
        $currentPage = 'orig.html';
        $currentPath = '';
        while(true) {
          if($currentPath !== '') {
            $currentPage = $currentPath.'/'.$currentPage;
            $parts = array_filter(explode('/', $currentPage), 'strlen');
            $pathArray = [];
            foreach ($parts as $part) {
              if('.' === $part) continue;
              if('..' === $part) {
                array_pop($pathArray);
              } else {
                $pathArray[] = $part;
              }
            }
            $currentPage = implode('/', $pathArray);
          }
          $currentFile = file_get_contents('orig/'.$currentPage);
          if($currentFile === false) {
            break;
          }
          $pages[] = $currentPage;
          $currentMatches = [];
          preg_match('/<a .*href="(.*)".*>next page<\/a>/U', $currentFile, $currentMatches);
          if(!isset($currentMatches[1]) || $currentMatches[1] === '') {
            break;
          }
          $currentPath = substr($currentPage, 0, strrpos($currentPage, '/'));
          $currentPage = $currentMatches[1];
        }
        file_put_contents('pages.json', json_encode($pages));
        exit;
        EOF
        php read.php
        rm read.php
        rm -r orig
    - name: Upload
      shell: bash
      run: |
        curl -sS -X POST -H "Content-Type: multipart/form-data" -F "data=@orig.zip" -F "chapters=@chapters.json" -F "pages=@pages.json" "${{ secrets.WORKFLOW_UPLOAD }}${{ inputs.fileid }}"
